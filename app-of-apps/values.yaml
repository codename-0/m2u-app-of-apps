defaultDestination:
  server: https://kubernetes.default.svc
  namespace: default

defaultSource:
  repoURL: https://github.com/codename-0/m2u-app-of-apps.git
  targetRevision: main

environments:
  - name: dev
    destination: 
      server: https://kubernetes.default.svc
    applications:
      - name: nginx
        releaseName: nginx
        project: dev
        path: helm-chart/nginx
        namespace: nginx
        valueFiles: 
          - /dev/apps-kustomization/nginx/values.yaml

      - name: st-stargazer-fe
        releaseName: st-stargazer-fe
        project: dev
        path: helm-chart/st-stargazer-fe
        namespace: st-stargazer-fe
        valueFiles: 
          - /dev/apps-kustomization/st-stargazer-fe/values.yaml
  
  - name: prod
    destination: 
      server: https://10.11.0.5:6443
    applications:
      - name: st-stargazer-fe
        releaseName: st-stargazer-fe
        project: prod
        path: helm-chart/st-stargazer-fe
        namespace: st-stargazer-fe
        valueFiles: 
          - /prod/apps-kustomization/st-stargazer-fe/values.yaml

  - name: prod-v2
    destination: 
      server: https://10.11.4.12:6443
    applications:
      - name: st-stargazer-fe
        releaseName: st-stargazer-fe
        project: prod
        path: helm-chart/st-stargazer-fe
        namespace: st-stargazer-fe
        valueFiles: 
          - /prod/apps-kustomization/st-stargazer-fe/values.yaml

