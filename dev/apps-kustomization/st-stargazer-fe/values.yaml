replicaCount: 1

image:
  repository: ghcr.io/codename-0/st-stargazer-world-fe
  tag: v0.0.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  ingressClassName: nginx
  host: nginx.st-stargazer.com
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi