replicaCount: 1

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  ingressClassName: nginx
  host: nginx.st-stargazer.com
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi
