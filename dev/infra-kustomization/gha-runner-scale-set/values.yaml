githubConfigSecret: "controller-manager-github-secret"
containerMode:
  type: "dind"

controllerServiceAccount:
  namespace: "arc-systems"
  name: gha-runner-scale-set-controller-gha-rs-controller

template:
  spec:
    nodeSelector:
      kubernetes.io/hostname: w0x01
      
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "arc-runners"
        effect: "NoSchedule"

    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.2
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for Docker daemon socket..."
            while [ ! -S /var/run/docker.sock ]; do
              sleep 1
            done
            echo "Docker socket is ready!"
            exec /home/runner/run.sh
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
        volumeMounts:
          - name: dind-sock
            mountPath: /var/run
          - name: work
            mountPath: /home/runner/_work

      - name: dind
        image: docker:dind
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --iptables=false
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        volumeMounts:
          - name: dind-sock
            mountPath: /var/run
          - name: work
            mountPath: /home/runner/_work
