githubConfigUrl: "https://github.com/codename-0/st-stargazer-world-fe.git"
githubConfigSecret: "controller-manager-github-secret"

controllerServiceAccount:
  namespace: "arc-systems"
  name: gha-runner-scale-set-controller-gha-rs-controller

template:
  spec:
    nodeSelector:
      kubernetes.io/hostname: w0x01
    
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "arc-runners"
        effect: "NoSchedule"

    containers:
      - name: runner
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
