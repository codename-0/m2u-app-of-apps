defaultDestination:
  server: https://kubernetes.default.svc
  namespace: default

defaultSource:
  repoURL: https://github.com/codename-0/m2u-app-of-apps.git
  targetRevision: main

environments:
  - name: dev
    destination:
      server: https://kubernetes.default.svc
    infrastructure:
      - name: metallb
        namespace: metallb-system
        repoURL: https://metallb.github.io/metallb
        targetRevision: 0.16.1
        extraPaths:
          - dev/infra-kustomization/metallb/pools

      - name: ingress-nginx
        namespace: ingress-nginx
        repoURL: https://kubernetes.github.io/ingress-nginx
        targetRevision: 4.15.1
        valueFiles:
          - /dev/infra-kustomization/ingress-nginx/values.yaml

      - infra:
        name: gha-runner-scale-set-controller
        repoURL: https://github.com/actions/actions-runner-controller.git
        targetRevision: 0.15.1
        namespace: arc-systems
        # valueFiles:
        #   - /dev/infra-kustomization/gha-runner-scale-set-controller/values.yaml

      - infra:
        name: gha-runner-scale-set
        repoURL: https://github.com/actions/actions-runner-controller.git
        targetRevision: 0.15.1
        namespace: arc-runners
        createNamespace: false
        valueFiles:
          - /dev/infra-kustomization/gha-runner-scale-set/values.yaml